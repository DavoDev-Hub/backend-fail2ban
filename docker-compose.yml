services:
  backend:
    build: .
    ports:
      - "5000:5000"
    cap_add:
      - NET_ADMIN   # Fail2Ban necesita esto para manejar reglas de iptables
      - NET_RAW
    environment:
      KEYCLOAK_ISSUER: http://localhost:8081/realms/cybersecurity
      KEYCLOAK_JWKS_URL: http://host.docker.internal:8081/realms/cybersecurity/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: fastapi-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
