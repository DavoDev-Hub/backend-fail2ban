# Filtro genérico de "flood" HTTP: a diferencia de un filtro de login (que
# solo cuenta intentos fallidos), este cuenta TODAS las peticiones de una IP.
# Combinado con maxretry/findtime en el jail, esto es lo que usa Fail2Ban
# para mitigar un DDoS/flood a nivel de aplicación (mismo patrón que el
# jail oficial "http-get-dos" que trae Fail2Ban).
[Definition]
failregex = ^<HOST> - - \[.*\] ".*"
ignoreregex =
